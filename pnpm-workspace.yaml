minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# semver@6.3.1 is a legit 2023 backport published without provenance after 7.5.x had it
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
